<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets — Texas Water Crisis Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333; min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        header {
            background: white; padding: 16px 24px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 12px;
            display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
        }
        h1 { color: #667eea; font-size: 1.8em; }
        .subtitle { color: #666; font-size: 0.95em; }
        .back-link {
            margin-left: auto; color: #667eea; text-decoration: none;
            font-weight: 600; font-size: 0.95em;
        }
        .back-link:hover { text-decoration: underline; }

        /* Dataset cards */
        .dataset-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px; margin-bottom: 12px;
        }
        .dataset-card {
            background: white; padding: 16px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
        }
        .dataset-card:hover { border-color: #667eea; transform: translateY(-2px); }
        .dataset-card.active { border-color: #667eea; background: #f5f3ff; }
        .dataset-name { font-size: 1.05em; font-weight: 600; color: #333; margin-bottom: 4px; }
        .dataset-desc { font-size: 0.85em; color: #666; margin-bottom: 8px; line-height: 1.4; }
        .dataset-meta {
            display: flex; gap: 12px; align-items: center;
            font-size: 0.8em; color: #888;
        }
        .dataset-meta .rows { font-weight: 600; color: #667eea; }
        .dataset-meta a {
            color: #667eea; text-decoration: none; font-weight: 600;
        }
        .dataset-meta a:hover { text-decoration: underline; }

        /* Viewer */
        .viewer {
            background: white; padding: 16px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 12px;
        }
        .viewer-controls {
            display: flex; gap: 10px; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .viewer-controls input[type="text"] {
            padding: 8px 12px; border: 2px solid #ddd; border-radius: 5px;
            font-size: 0.95em; flex: 1; min-width: 200px;
            transition: border-color 0.3s;
        }
        .viewer-controls input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 5px rgba(102,126,234,0.3); }
        .viewer-info { font-size: 0.85em; color: #888; margin-left: auto; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
        th {
            background: #f5f5f5; font-weight: 600; color: #333;
            cursor: pointer; user-select: none; position: sticky; top: 0;
        }
        th:hover { background: #e8e8e8; }
        th .sort-arrow { color: #667eea; margin-left: 4px; }
        tr:hover { background: #f9f9f9; }

        /* Pagination */
        .pagination {
            display: flex; gap: 4px; align-items: center;
            justify-content: center; margin-top: 12px; flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px;
            background: white; cursor: pointer; font-size: 0.85em;
            transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled):not(.active) { background: #f0f0f0; border-color: #667eea; }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination .ellipsis { padding: 6px 4px; color: #888; }

        footer {
            background: white; padding: 16px; border-radius: 10px;
            text-align: center; color: #666; margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            header { padding: 12px 16px; flex-direction: column; gap: 4px; }
            .back-link { margin-left: 0; }
            h1 { font-size: 1.4em; }
            .dataset-grid { grid-template-columns: 1fr; }
            th, td { padding: 6px 8px; font-size: 0.82em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Datasets</h1>
            <p class="subtitle">Raw data files powering the dashboard</p>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </header>

        <div class="dataset-grid" id="datasetGrid"></div>

        <div class="viewer" id="viewer" style="display:none;">
            <div class="viewer-controls">
                <input type="text" id="searchBox" placeholder="Search across all columns..." oninput="searchData(this.value)">
                <span class="viewer-info" id="viewerInfo"></span>
            </div>
            <div class="table-wrap" id="tableContainer"></div>
            <div class="pagination" id="pagination"></div>
        </div>

        <footer>
            <p>Texas Water Crisis Analysis &mdash; TXST Datathon 2026</p>
            <p style="font-size: 0.9em; margin-top: 8px;">
                Data: <a href="https://texasstatewaterplan.org/" target="_blank">Texas State Water Plan</a> |
                <a href="https://www.twdb.texas.gov/" target="_blank">TWDB</a> |
                <a href="https://www.epa.gov/frs" target="_blank">EPA Facility Registry Service</a>
            </p>
        </footer>
    </div>

    <script>
        const datasets = [
            { id: 'demands', file: 'data/demands.csv', name: 'Water Demand Projections',
              desc: 'Projected water demand by entity, sector, region, and county for each decade (2020–2070). Units: acre-feet/year.' },
            { id: 'existing', file: 'data/existing.csv', name: 'Existing Water Supply',
              desc: 'Water available from existing sources by entity and supply type for each decade (2020–2070). Units: acre-feet/year.' },
            { id: 'needs', file: 'data/needs.csv', name: 'Unmet Water Needs',
              desc: 'Unmet water needs (demand minus supply, where positive) by entity for each decade (2020–2070). Units: acre-feet/year.' },
            { id: 'population', file: 'data/population.csv', name: 'Population Projections',
              desc: 'Population projections by water user group and county for each decade (2020–2070).' },
            { id: 'strategies', file: 'data/strategies.csv', name: 'Water Management Strategies',
              desc: 'Recommended water management strategies with projected supply gains for each decade (2020–2070). Units: acre-feet/year.' },
            { id: 'datacenters', file: 'data/datacenters_locations.csv', name: 'Data Center Locations',
              desc: 'Data center facility locations in Texas from EPA Facility Registry Service (FRS). Includes coordinates and addresses.' },
            { id: 'semifabs', file: 'data/semi_facilites_with_location.csv', name: 'Semiconductor Fab Locations',
              desc: 'Semiconductor fabrication facility locations in Texas from EPA Facility Registry Service (FRS). Includes coordinates and addresses.' }
        ];

        let headers = [];
        let allRows = [];
        let filteredRows = [];
        let currentPage = 1;
        let sortCol = -1;
        let sortAsc = true;
        let activeDataset = null;
        const PAGE_SIZE = 50;

        // Build dataset cards
        function buildCards() {
            const grid = document.getElementById('datasetGrid');
            grid.innerHTML = datasets.map(d =>
                `<div class="dataset-card" id="card-${d.id}" onclick="loadDataset('${d.id}')">
                    <div class="dataset-name">${d.name}</div>
                    <div class="dataset-desc">${d.desc}</div>
                    <div class="dataset-meta">
                        <span class="rows" id="rows-${d.id}">—</span> rows
                        <a href="${d.file}" download onclick="event.stopPropagation()">Download CSV</a>
                    </div>
                </div>`
            ).join('');
        }

        async function loadDataset(id) {
            const ds = datasets.find(d => d.id === id);
            if (!ds) return;

            // Update active card
            document.querySelectorAll('.dataset-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${id}`).classList.add('active');
            activeDataset = ds;

            // Show viewer
            document.getElementById('viewer').style.display = 'block';
            document.getElementById('tableContainer').innerHTML = '<p style="padding:20px;color:#888;">Loading...</p>';
            document.getElementById('searchBox').value = '';

            try {
                const resp = await fetch(ds.file);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const result = Papa.parse(text, { header: false, skipEmptyLines: true });

                headers = result.data[0] || [];
                allRows = result.data.slice(1);
                filteredRows = [...allRows];
                currentPage = 1;
                sortCol = -1;
                sortAsc = true;

                // Update row count on card
                document.getElementById(`rows-${id}`).textContent = allRows.length.toLocaleString();

                renderTable();
                renderPagination();

                // Scroll viewer into view
                document.getElementById('viewer').scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (e) {
                document.getElementById('tableContainer').innerHTML =
                    `<p style="padding:20px;color:#d32f2f;">Failed to load ${ds.file}: ${e.message}</p>`;
            }
        }

        function searchData(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                filteredRows = [...allRows];
            } else {
                filteredRows = allRows.filter(row =>
                    row.some(cell => (cell || '').toLowerCase().includes(q))
                );
            }
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function sortByColumn(colIndex) {
            if (sortCol === colIndex) {
                sortAsc = !sortAsc;
            } else {
                sortCol = colIndex;
                sortAsc = true;
            }
            filteredRows.sort((a, b) => {
                const va = a[colIndex] || '';
                const vb = b[colIndex] || '';
                const na = parseFloat(va);
                const nb = parseFloat(vb);
                if (!isNaN(na) && !isNaN(nb)) return sortAsc ? na - nb : nb - na;
                return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
            });
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function renderTable() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filteredRows.length);
            const pageRows = filteredRows.slice(start, end);

            let html = '<table><tr>';
            headers.forEach((h, i) => {
                const arrow = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : '';
                html += `<th onclick="sortByColumn(${i})">${h}<span class="sort-arrow">${arrow}</span></th>`;
            });
            html += '</tr>';

            if (pageRows.length === 0) {
                html += `<tr><td colspan="${headers.length}" style="text-align:center;color:#888;padding:20px;">No matching rows</td></tr>`;
            } else {
                pageRows.forEach(row => {
                    html += '<tr>';
                    headers.forEach((_, i) => { html += `<td>${row[i] || ''}</td>`; });
                    html += '</tr>';
                });
            }
            html += '</table>';

            document.getElementById('tableContainer').innerHTML = html;

            // Info text
            const total = allRows.length;
            const filtered = filteredRows.length;
            let info = `Showing ${filteredRows.length > 0 ? start + 1 : 0}–${end} of ${filtered.toLocaleString()} rows`;
            if (filtered < total) info += ` (filtered from ${total.toLocaleString()})`;
            document.getElementById('viewerInfo').textContent = info;
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">← Prev</button>`;

            for (let p = 1; p <= totalPages; p++) {
                if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
                    html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
                } else if (p === 2 && currentPage > 4) {
                    html += '<span class="ellipsis">…</span>';
                } else if (p === totalPages - 1 && currentPage < totalPages - 3) {
                    html += '<span class="ellipsis">…</span>';
                }
            }

            html += `<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next →</button>`;
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(p) {
            const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            renderTable();
            renderPagination();
        }

        // Init
        buildCards();
    </script>
</body>
</html>
